<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBU Leverandør — Find klubber at sponsorere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    /* ---- layout: sidebar + main, matched to the shirt-buying flow ---- */
    .p-scout .scout-body { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: start; }
    .p-scout .scout-title { display: flex; align-items: baseline; gap: 12px; margin: 0; }
    .p-scout .scout-title h1 { font-family: var(--font-primary); font-size: 34px; font-weight: 700; margin: 0; }
    .p-scout .scout-title span { font-size: 15px; color: var(--muted-foreground); }
    .p-scout .scout-intro { font-size: 15px; color: var(--muted-foreground); margin: 8px 0 0; max-width: 680px; }

    /* ---- sidebar (copied idiom from category-shirts) ---- */
    .p-scout .sidebar { display: flex; flex-direction: column; gap: 8px; }
    .p-scout .side-head { font-family: var(--font-primary); font-size: 13px; font-weight: 600; letter-spacing: 1px; color: var(--muted-foreground); }
    .p-scout .side-menu { display: flex; flex-direction: column; }
    .p-scout .side-menu a { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: var(--radius-s); font-size: 14px; color: var(--foreground); cursor: pointer; }
    .p-scout .side-menu a:hover { background: var(--background); }
    .p-scout .side-menu a.is-active { background: var(--accent); color: var(--primary); font-family: var(--font-primary); font-weight: 600; }
    .p-scout .side-menu a .count { font-size: 12px; color: var(--muted-foreground); }
    .p-scout .side-div { height: 1px; background: var(--border); margin: 8px 0; }

    /* ---- filter bar (pills + dropdowns) ---- */
    .p-scout .filter-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    .p-scout .filter-pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-pill); background: var(--card); border: 1px solid var(--border); font-family: var(--font-primary); font-size: 14px; font-weight: 600; color: var(--foreground); cursor: pointer; }
    .p-scout .filter-pill .icon { width: 16px; height: 16px; color: var(--muted-foreground); }
    .p-scout .filter-reset { margin-left: auto; align-self: center; font-size: 14px; font-weight: 600; color: var(--muted-foreground); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .p-scout .filter-reset:hover { color: var(--primary); }
    .p-scout .results-count { font-size: 14px; color: var(--muted-foreground); margin: 16px 0; }

    /* ---- table ---- */
    .p-scout .table { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); overflow: hidden; }
    .p-scout .row { display: grid; grid-template-columns: 20px minmax(270px, 1fr) 116px 90px 124px 136px 104px 92px; gap: 16px; align-items: center; padding: 16px 22px; }
    .p-scout .row.head { background: var(--background); padding: 13px 22px; }
    .p-scout .row.head .col { font-family: var(--font-primary); font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--foreground); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; background: none; border: 0; padding: 0; text-align: left; }
    .p-scout .row.head .col.num { justify-content: flex-end; }
    .p-scout .row.head .col .sicon { width: 13px; height: 13px; color: var(--muted-foreground); }
    .p-scout .row.head .col.is-sorted { color: var(--primary); }
    .p-scout .row.head .col.is-sorted .sicon { color: var(--primary); }
    .p-scout .rdiv { height: 1px; background: var(--border); }
    .p-scout .star { width: 20px; height: 20px; cursor: pointer; }
    .p-scout .star.on { color: var(--primary); fill: var(--primary); }
    .p-scout .star.off { color: var(--input-border); }

    .p-scout .identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .p-scout .crest { width: 40px; height: 40px; border-radius: var(--radius-m); display: grid; place-items: center; color: #fff; font-family: var(--font-primary); font-size: 14px; font-weight: 700; flex-shrink: 0; }
    .p-scout .idc { min-width: 0; }
    .p-scout .idc b { display: block; font-family: var(--font-primary); font-size: 16px; font-weight: 700; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-scout .idc span { display: block; font-size: 12px; color: var(--muted-foreground); }

    .p-scout .loc { display: flex; flex-direction: column; gap: 2px; }
    .p-scout .loc .lc { font-family: var(--font-primary); font-size: 14px; font-weight: 600; color: var(--foreground); }
    .p-scout .loc .lr { font-size: 12px; color: var(--muted-foreground); }

    .p-scout .num-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
    .p-scout .num-cell .n { font-family: var(--font-primary); font-size: 16px; font-weight: 700; color: var(--foreground); }
    .p-scout .num-cell .nl { font-size: 11px; color: var(--muted-foreground); }

    .p-scout .reach { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
    .p-scout .rv { display: flex; align-items: center; gap: 7px; }
    .p-scout .rv .n { font-family: var(--font-primary); font-size: 16px; font-weight: 700; color: var(--foreground); }
    .p-scout .trend { display: inline-flex; align-items: center; gap: 2px; padding: 2px 6px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; }
    .p-scout .trend .icon { width: 11px; height: 11px; }
    .p-scout .trend.up { background: var(--color-success); color: var(--color-success-foreground); }
    .p-scout .trend.flat { background: var(--background); color: var(--muted-foreground); }
    .p-scout .rlabel { font-size: 11px; color: var(--muted-foreground); }

    .p-scout .spons { display: flex; flex-direction: column; gap: 6px; }
    .p-scout .bar { display: flex; gap: 3px; }
    .p-scout .seg { width: 11px; height: 6px; border-radius: var(--radius-s); }
    .p-scout .seg.on { background: var(--pitch-green); }
    .p-scout .seg.off { background: var(--border); }
    .p-scout .slabel { font-size: 12px; color: var(--muted-foreground); }

    .p-scout .fra { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .p-scout .fra .fl { font-family: var(--font-primary); font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--muted-foreground); }
    .p-scout .fra .fp { font-family: var(--font-primary); font-size: 17px; font-weight: 700; color: var(--primary); white-space: nowrap; }

    .p-scout .scout-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 22px; }
    .p-scout .scout-footer .shown { font-size: 13px; color: var(--muted-foreground); }

    @media (max-width: 1100px) { .p-scout .scout-body { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-active="udforsk" class="p-scout" data-acct="Simon Sponsor" data-group="Salling Group" data-abbr="SS" data-nav-label="Min side">
  <div class="page">
    <div data-include="header"></div>

    <section class="section" style="padding:28px 40px 40px">
      <!-- Breadcrumb -->
      <div class="crumb" style="margin-bottom:18px">
        <a href="index.html">Markedsplads</a>
        <i data-lucide="chevron-right" class="icon"></i>
        <span style="color:var(--primary);font-weight:600">Find klubber</span>
      </div>

      <div class="scout-body">
        <!-- Sidebar -->
        <aside class="sidebar">
          <div class="side-head">REGION</div>
          <nav class="side-menu" id="side-region"></nav>
          <div class="side-div"></div>
          <div class="side-head">RÆKKE</div>
          <nav class="side-menu" id="side-series"></nav>
        </aside>

        <!-- Main -->
        <div>
          <div class="scout-title">
            <h1>Find klubber at sponsorere</h1>
            <span data-shown>50 klubber</span>
          </div>
          <p class="scout-intro">Scout blandt 50 klubber der søger sponsorer — sammenlign tilskuere, rækkevidde, ledige sponsorater og pris.</p>

          <div class="filter-bar">
            <button class="filter-pill" data-dd="sort"><span data-lbl>Sortér efter</span> <i data-lucide="chevron-down" class="icon"></i></button>
            <button class="filter-pill" data-dd="price"><span data-lbl>Sponsorat-størrelse</span> <i data-lucide="chevron-down" class="icon"></i></button>
            <button class="filter-pill" data-dd="spons"><span data-lbl>Ledige sponsorater</span> <i data-lucide="chevron-down" class="icon"></i></button>
            <a class="filter-reset" data-reset-all href="#">Nulstil alle filtre</a>
          </div>

          <p class="results-count"><span data-shown>50 klubber</span></p>

          <!-- Scouting table -->
          <div class="table" id="scout-table"></div>

          <!-- Footer -->
          <div class="scout-footer">
            <span class="shown" data-shown>50 klubber</span>
          </div>
        </div>
      </div>
    </section>

    <div data-include="footer"></div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/store.js"></script>
  <script src="js/site.js"></script>
  <script src="js/tweaks.js"></script>
  <script>
    (function () {
      /* Each tuple: [name, abbr, crest, by, region, series, attendance, members, sponsOpen, sponsTotal, priceFrom] */
      var palette = ["#D60A2E","#1A1A1A","#1A56DB","#3F8F3F","#8E0014","#9A6700","#0F766E","#6D28D9","#B45309","#0369A1","#BE185D","#15803D","#4338CA","#A21CAF","#C2410C","#0E7490","#7C3AED","#B91C1C","#166534","#1D4ED8"];
      var raw = [
        ["FC Duckwise","FCD","Andeby","Sjælland","Serie 2",420,1248,4,6,12000],
        ["Trifork Tigers","TT","Aarhus","Midtjylland","Serie 1",680,2106,5,7,18000],
        ["CPH Mallards","CM","København","Hovedstaden","Danmarksserien",1340,3420,3,8,55000],
        ["Aarhus Ducks","AD","Aarhus","Midtjylland","Serie 3",180,842,6,6,8000],
        ["Nørrebro Nightingales","NN","København","Hovedstaden","Serie 2",510,1560,2,5,15000],
        ["Odense Otters","OO","Odense","Fyn","Kvindeligaen",760,1090,4,6,22000],
        ["Vejle Vikings","VV","Vejle","Syddanmark","2. Division",2480,4180,2,9,120000],
        ["Aalborg Auks","AA","Aalborg","Nordjylland","Danmarksserien",1620,2960,3,8,60000],
        ["Esbjerg Egrets","EE","Esbjerg","Syddanmark","Serie 1",540,1380,5,7,16000],
        ["Roskilde Ravens","RR","Roskilde","Sjælland","Serie 2",460,1240,4,6,13000],
        ["Frederikshavn Falcons","FF","Frederikshavn","Nordjylland","Serie 3",150,690,6,6,7000],
        ["Hillerød Herons","HH","Hillerød","Hovedstaden","Serie 1",620,1720,4,7,19000],
        ["Kolding Kestrels","KK","Kolding","Syddanmark","Danmarksserien",1180,2540,3,8,48000],
        ["Silkeborg Swifts","SS","Silkeborg","Midtjylland","Serie 1",700,1840,5,7,21000],
        ["Helsingør Harriers","HE","Helsingør","Hovedstaden","Serie 2",480,1320,3,6,14000],
        ["Randers Robins","RB","Randers","Midtjylland","2. Division",2100,3880,2,9,95000],
        ["Næstved Nuthatches","NX","Næstved","Sjælland","Serie 1",560,1460,4,7,17000],
        ["Horsens Hawks","HW","Horsens","Midtjylland","Danmarksserien",1260,2680,3,8,52000],
        ["Svendborg Sparrows","SP","Svendborg","Fyn","Serie 2",430,1180,5,6,11000],
        ["Hvidovre Hornbills","HB","Hvidovre","Hovedstaden","2. Division",1980,3460,2,9,88000],
        ["Viborg Vultures","VU","Viborg","Midtjylland","Serie 1",650,1620,4,7,18500],
        ["Holbæk Hobbies","HO","Holbæk","Sjælland","Serie 3",170,720,6,6,6500],
        ["Glostrup Goshawks","GG","Glostrup","Hovedstaden","Serie 2",390,1080,4,6,12500],
        ["Fredericia Finches","FI","Fredericia","Syddanmark","Danmarksserien",1100,2380,3,8,45000],
        ["Køge Crows","KC","Køge","Sjælland","Serie 1",580,1540,5,7,16500],
        ["Aabenraa Albatrosses","AB","Aabenraa","Syddanmark","Serie 2",360,980,4,6,10500],
        ["Gladsaxe Grebes","GR","Gladsaxe","Hovedstaden","Serie 1",640,1680,4,7,20000],
        ["Herning Herons","HG","Herning","Midtjylland","2. Division",2260,4020,2,9,110000],
        ["Slagelse Storks","ST","Slagelse","Sjælland","Serie 2",410,1140,5,6,11500],
        ["Hjørring Hummingbirds","HM","Hjørring","Nordjylland","Kvinde 1. Division",520,1260,4,6,15500],
        ["Ballerup Buzzards","BZ","Ballerup","Hovedstaden","Serie 1",600,1580,4,7,17500],
        ["Nyborg Nightjars","NJ","Nyborg","Fyn","Serie 3",160,640,6,6,6000],
        ["Skive Skylarks","SK","Skive","Midtjylland","Serie 2",380,1020,5,6,10000],
        ["Taastrup Terns","TE","Taastrup","Hovedstaden","Serie 1",560,1420,4,7,16000],
        ["Frederikssund Flamingos","FL","Frederikssund","Sjælland","Serie 2",340,920,4,6,9500],
        ["Sønderborg Shrikes","SH","Sønderborg","Syddanmark","Danmarksserien",980,2160,3,8,42000],
        ["Brønshøj Bitterns","BT","Brønshøj","Hovedstaden","2. Division",1760,3120,2,9,80000],
        ["Thisted Thrushes","TH","Thisted","Nordjylland","Serie 1",470,1240,5,7,14500],
        ["Ringsted Rooks","RK","Ringsted","Sjælland","Serie 3",140,580,6,6,5500],
        ["Middelfart Magpies","MG","Middelfart","Fyn","Serie 2",400,1100,5,6,11000],
        ["Lyngby Larks","LL","Lyngby","Hovedstaden","Danmarksserien",1420,2820,3,8,58000],
        ["Grenaa Godwits","GW","Grenaa","Midtjylland","Serie 3",150,620,6,6,6000],
        ["Haderslev Hoopoes","HP","Haderslev","Syddanmark","Serie 1",530,1360,5,7,15000],
        ["Albertslund Avocets","AV","Albertslund","Hovedstaden","Serie 2",370,1000,4,6,10000],
        ["Frederiksberg Falconets","FB","Frederiksberg","Hovedstaden","2. Division",2640,4480,2,9,150000],
        ["Nykøbing Nuthatches","NK","Nykøbing F","Sjælland","Danmarksserien",1040,2260,3,8,44000],
        ["Brabrand Bee-eaters","BE","Brabrand","Midtjylland","Serie 1",610,1600,4,7,18000],
        ["Ikast Ibises","IB","Ikast","Midtjylland","Serie 2",350,960,5,6,9500],
        ["Greve Goldcrests","GC","Greve","Sjælland","Serie 1",590,1500,4,7,16500],
        ["Vanløse Wagtails","WT","Vanløse","Hovedstaden","Kvindeligaen",820,1340,3,6,28000]
      ];

      var clubs = raw.map(function (r, i) {
        return {
          name: r[0], abbr: r[1], crest: palette[i % palette.length],
          by: r[2], region: r[3], series: r[4],
          att: r[5], members: r[6], sponsOpen: r[7], sponsTotal: r[8], price: r[9],
          star: false,
          trendDir: (r[5] >= 350 ? "up" : "flat"),
          trend: (r[5] >= 700 ? "+" + (4 + (i % 9)) + "%" : (r[5] >= 350 ? "+" + (1 + (i % 4)) + "%" : "0%"))
        };
      });

      function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
      function segs(on, total) {
        var s = "";
        for (var i = 0; i < total; i++) s += '<span class="seg ' + (i < on ? "on" : "off") + '"></span>';
        return s;
      }

      /* ---- interactive state ---- */
      var state = { region: null, series: null, price: null, spons: null, sortKey: "att", sortDir: "desc" };

      var PRICES = [
        { k: null, label: "Alle størrelser" },
        { k: "u15", label: "Under 15.000 kr", test: function (p) { return p < 15000; } },
        { k: "15-50", label: "15.000–50.000 kr", test: function (p) { return p >= 15000 && p <= 50000; } },
        { k: "50-100", label: "50.000–100.000 kr", test: function (p) { return p > 50000 && p <= 100000; } },
        { k: "o100", label: "Over 100.000 kr", test: function (p) { return p > 100000; } }
      ];
      var SPONS = [
        { k: null, label: "Alle klubber" },
        { k: "any", label: "Mindst 1 ledigt", test: function (c) { return c.sponsOpen >= 1; } },
        { k: "many", label: "3+ ledige", test: function (c) { return c.sponsOpen >= 3; } },
        { k: "all", label: "Alle pladser ledige", test: function (c) { return c.sponsOpen === c.sponsTotal; } }
      ];
      var SORTS = [
        { k: "att", label: "Tilskuere" },
        { k: "members", label: "Rækkevidde" },
        { k: "price", label: "Pris: lav til høj", dir: "asc" },
        { k: "name", label: "Navn: A–Å", dir: "asc" }
      ];

      /* columns that are clickable in the header */
      var COLS = [
        { key: null, label: "", cls: "" },
        { key: "name", label: "KLUB", cls: "" },
        { key: "by", label: "LOKATION", cls: "" },
        { key: "att", label: "TILSKUERE", cls: "num" },
        { key: "members", label: "RÆKKEVIDDE", cls: "num" },
        { key: "sponsOpen", label: "SPONSORATER", cls: "" },
        { key: "price", label: "FRA", cls: "num" },
        { key: null, label: "", cls: "" }
      ];

      function matches(c) {
        if (state.region && c.region !== state.region) return false;
        if (state.series && c.series !== state.series) return false;
        if (state.price) {
          var pf = PRICES.filter(function (x) { return x.k === state.price; })[0];
          if (pf && pf.test && !pf.test(c.price)) return false;
        }
        if (state.spons) {
          var sf = SPONS.filter(function (x) { return x.k === state.spons; })[0];
          if (sf && sf.test && !sf.test(c)) return false;
        }
        return true;
      }

      function current() {
        var list = clubs.filter(matches);
        var k = state.sortKey, dir = state.sortDir === "asc" ? 1 : -1;
        list.sort(function (a, b) {
          if (k === "name") return a.name.localeCompare(b.name, "da") * dir;
          if (k === "by") return a.by.localeCompare(b.by, "da") * dir;
          return (a[k] - b[k]) * dir;
        });
        return list;
      }

      function buildHead() {
        return '<div class="row head">' + COLS.map(function (col) {
          if (!col.key) return '<div class="col ' + col.cls + '">' + col.label + '</div>';
          var sorted = state.sortKey === col.key;
          var icon = sorted ? (state.sortDir === "asc" ? "arrow-up" : "arrow-down") : "chevrons-up-down";
          return '<button class="col ' + col.cls + (sorted ? " is-sorted" : "") + '" data-sort="' + col.key + '">' +
            col.label + ' <i data-lucide="' + icon + '" class="sicon"></i></button>';
        }).join("") + '</div>';
      }

      function render() {
        var list = current();
        var html = buildHead();
        if (list.length === 0) {
          html += '<div class="cat-empty" style="padding:48px 20px"><i data-lucide="search-x" class="icon"></i>' +
            '<p>Ingen klubber matcher dine filtre.</p>' +
            '<button class="btn btn--ghost btn--sm" data-reset>Nulstil filtre</button></div>';
        } else {
          list.forEach(function (c) {
            var ti = c.trendDir === "up" ? "trending-up" : "minus";
            html += '<div class="rdiv"></div>';
            html += '<div class="row">' +
              '<i data-lucide="star" class="star ' + (c.star ? "on" : "off") + '" data-fav="' + c.abbr + '"></i>' +
              '<div class="identity">' +
                '<div class="crest" style="background:' + c.crest + '">' + c.abbr + '</div>' +
                '<div class="idc"><b>' + c.name + '</b><span>' + c.series + '</span></div>' +
              '</div>' +
              '<div class="loc"><span class="lc">' + c.by + '</span><span class="lr">' + c.region + '</span></div>' +
              '<div class="num-cell"><span class="n">' + fmt(c.att) + '</span><span class="nl">pr. hjemmekamp</span></div>' +
              '<div class="reach"><div class="rv"><span class="n">' + fmt(c.members) + '</span>' +
                '<span class="trend ' + c.trendDir + '"><i data-lucide="' + ti + '" class="icon"></i>' + c.trend + '</span></div>' +
                '<span class="rlabel">medlemmer</span></div>' +
              '<div class="spons"><div class="bar">' + segs(c.sponsOpen, c.sponsTotal) + '</div>' +
                '<span class="slabel">' + c.sponsOpen + ' af ' + c.sponsTotal + ' ledige</span></div>' +
              '<div class="fra"><span class="fl">FRA</span><span class="fp">' + fmt(c.price) + ' kr</span></div>' +
              '<div class="action"><a class="btn btn--sm btn--block" href="#">Se klub</a></div>' +
            '</div>';
          });
        }
        document.getElementById("scout-table").innerHTML = html;

        var label = list.length === clubs.length ? clubs.length + " klubber"
          : "Viser " + list.length + " af " + clubs.length + " klubber";
        document.querySelectorAll("[data-shown]").forEach(function (el) { el.textContent = label; });

        bindHead();
        bindStars();
        var rb = document.querySelector("[data-reset]");
        if (rb) rb.addEventListener("click", resetFilters);
        if (window.lucide) lucide.createIcons();
      }

      function bindHead() {
        document.querySelectorAll("[data-sort]").forEach(function (b) {
          b.addEventListener("click", function () {
            var k = b.getAttribute("data-sort");
            if (state.sortKey === k) {
              state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
            } else {
              state.sortKey = k;
              state.sortDir = (k === "name" || k === "by" || k === "price") ? "asc" : "desc";
            }
            syncSortPill();
            render();
          });
        });
      }

      function bindStars() {
        document.querySelectorAll("[data-fav]").forEach(function (s) {
          s.addEventListener("click", function () {
            var ab = s.getAttribute("data-fav");
            var c = clubs.filter(function (x) { return x.abbr === ab; })[0];
            if (c) { c.star = !c.star; render(); }
          });
        });
      }

      /* ---- sidebar groups (region + series) with live counts ---- */
      function counts(field) {
        var m = {};
        clubs.forEach(function (c) { m[c[field]] = (m[c[field]] || 0) + 1; });
        return m;
      }

      function buildSidebar() {
        var rc = counts("region"), sc = counts("series");
        var regions = Object.keys(rc).sort(function (a, b) { return a.localeCompare(b, "da"); });
        var series = Object.keys(sc).sort(function (a, b) { return a.localeCompare(b, "da"); });

        var rHtml = '<a data-region="" class="is-active">Alle klubber <span class="count">' + clubs.length + '</span></a>';
        rHtml += regions.map(function (r) {
          return '<a data-region="' + r + '">' + r + ' <span class="count">' + rc[r] + '</span></a>';
        }).join("");
        document.getElementById("side-region").innerHTML = rHtml;

        var sHtml = '<a data-series="" class="is-active">Alle rækker <span class="count">' + clubs.length + '</span></a>';
        sHtml += series.map(function (s) {
          return '<a data-series="' + s + '">' + s + ' <span class="count">' + sc[s] + '</span></a>';
        }).join("");
        document.getElementById("side-series").innerHTML = sHtml;

        document.querySelectorAll("[data-region]").forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            state.region = a.getAttribute("data-region") || null;
            document.querySelectorAll("[data-region]").forEach(function (x) { x.classList.remove("is-active"); });
            a.classList.add("is-active");
            render();
          });
        });
        document.querySelectorAll("[data-series]").forEach(function (a) {
          a.addEventListener("click", function (e) {
            e.preventDefault();
            state.series = a.getAttribute("data-series") || null;
            document.querySelectorAll("[data-series]").forEach(function (x) { x.classList.remove("is-active"); });
            a.classList.add("is-active");
            render();
          });
        });
      }

      function resetFilters() {
        state.region = null; state.series = null; state.price = null; state.spons = null;
        state.sortKey = "att"; state.sortDir = "desc";
        document.querySelectorAll("[data-region]").forEach(function (x) { x.classList.remove("is-active"); });
        document.querySelectorAll("[data-series]").forEach(function (x) { x.classList.remove("is-active"); });
        var ar = document.querySelector('[data-region=""]'); if (ar) ar.classList.add("is-active");
        var as = document.querySelector('[data-series=""]'); if (as) as.classList.add("is-active");
        syncPills();
        render();
      }

      /* ---- filter-bar dropdowns ---- */
      function attachDD(pill, options, onPick) {
        if (!pill) return;
        function close() { var m = pill.parentNode.querySelector(".dd__menu"); if (m) m.remove(); pill.classList.remove("is-open"); }
        pill.addEventListener("click", function (e) {
          e.stopPropagation();
          if (pill.parentNode.querySelector(".dd__menu")) { close(); return; }
          var menu = document.createElement("div");
          menu.className = "dd__menu";
          menu.innerHTML = options.map(function (o, i) { return '<button class="dd__opt" data-i="' + i + '">' + o.label + '</button>'; }).join("");
          pill.parentNode.style.position = "relative";
          pill.parentNode.appendChild(menu);
          menu.querySelectorAll(".dd__opt").forEach(function (b) {
            b.addEventListener("click", function (ev) { ev.stopPropagation(); onPick(options[parseInt(b.getAttribute("data-i"), 10)]); close(); });
          });
          pill.classList.add("is-open");
        });
        document.addEventListener("click", close);
      }

      function syncSortPill() {
        var sp = document.querySelector('[data-dd="sort"]');
        if (!sp) return;
        var s = SORTS.filter(function (x) { return x.k === state.sortKey; })[0];
        var arrow = state.sortDir === "asc" ? " ↑" : " ↓";
        sp.querySelector("[data-lbl]").textContent = "Sortér: " + (s ? s.label.replace(/: .*$/, "") : "Tilskuere") + arrow;
        sp.classList.add("filter-pill--active");
      }

      function syncPills() {
        var pp = document.querySelector('[data-dd="price"]');
        if (pp) {
          var p = PRICES.filter(function (x) { return x.k === state.price; })[0];
          pp.querySelector("[data-lbl]").textContent = state.price ? p.label : "Sponsorat-størrelse";
          pp.classList.toggle("filter-pill--active", !!state.price);
        }
        var sp = document.querySelector('[data-dd="spons"]');
        if (sp) {
          var s = SPONS.filter(function (x) { return x.k === state.spons; })[0];
          sp.querySelector("[data-lbl]").textContent = state.spons ? s.label : "Ledige sponsorater";
          sp.classList.toggle("filter-pill--active", !!state.spons);
        }
        syncSortPill();
      }

      attachDD(document.querySelector('[data-dd="sort"]'), SORTS, function (o) {
        state.sortKey = o.k; state.sortDir = o.dir || "desc"; syncSortPill(); render();
      });
      attachDD(document.querySelector('[data-dd="price"]'), PRICES, function (o) {
        state.price = o.k; syncPills(); render();
      });
      attachDD(document.querySelector('[data-dd="spons"]'), SPONS, function (o) {
        state.spons = o.k; syncPills(); render();
      });

      var resetLink = document.querySelector("[data-reset-all]");
      if (resetLink) resetLink.addEventListener("click", function (e) { e.preventDefault(); resetFilters(); });

      buildSidebar();
      syncPills();
      render();
    })();
  </script>
</body>
</html>
